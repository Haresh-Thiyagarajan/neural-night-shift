<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Read the clues and guess the brain chemical. An AP Psychology detective game.">
<title>Neural Night Shift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Condensed:wght@400;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one centered column, one thing to do per screen. */
:root{
  color-scheme:dark;
  --bg:#10131a;
  --panel:#1a2030;
  --panel2:#222a3d;
  --line:#34405a;
  --ink:#f3efe6;
  --ink2:#c9c6be;
  --muted:#9aa2b4;
  --blue:#9db6dc;
  --sage:#9fd0ac;
  --sage-bg:#9fd0ac22;
  --rust:#e39a7a;
  --rust-bg:#e39a7a22;
  --amber:#e6be7a;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
::selection{background:#9db6dc55}
html,body{background:var(--bg);color:var(--ink);margin:0}
body{font-family:var(--f-body);font-size:18px;line-height:1.5;background:var(--bg);min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
main{max-width:640px;margin:0 auto;padding:32px 16px 64px;display:grid;gap:22px}

.btn{display:block;width:100%;border:0;border-radius:14px;padding:18px 20px;font-family:var(--f-display);font-weight:600;font-size:22px;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:#10131a;transition:transform .08s,background .15s}
.btn:hover{background:#fff}
.btn:active{transform:scale(.98)}
.btn.soft{background:var(--panel);color:var(--ink);border:2px solid var(--line);font-size:18px}
.btn.soft:hover{border-color:var(--blue)}

/* start */
.title{font-family:var(--f-display);font-weight:600;font-size:clamp(44px,12vw,76px);line-height:.95;letter-spacing:.04em;margin:24px 0 0;text-wrap:balance}
.title span{font-weight:400;color:var(--blue)}
.lead{font-size:22px;margin:0;color:var(--ink)}
.steps{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:14px;align-items:center;background:var(--panel);border-radius:12px;padding:14px 16px;font-size:18px}
.steps b{flex:none;width:34px;height:34px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-family:var(--f-mono);font-size:16px;color:var(--blue)}
.best{text-align:center;color:var(--muted);font-size:16px;margin:0}

/* game */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--f-mono);font-size:15px;color:var(--ink2)}
.top .stars{color:var(--amber)}
.track{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
.track i{display:block;height:100%;width:100%;background:var(--blue);transform-origin:left;transform:scaleX(var(--p,0));transition:transform .4s cubic-bezier(.16,1,.3,1)}
h2{font-family:var(--f-display);font-weight:600;font-size:30px;margin:0;letter-spacing:.02em}
.clues{display:grid;gap:10px}
.clue{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:14px 16px;animation:pop .25s ease-out}
.clue small{display:block;font-family:var(--f-mono);font-size:13px;color:var(--blue);letter-spacing:.1em;margin-bottom:2px}
.clue p{margin:0;font-size:21px}
@keyframes pop{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}
.more{width:100%;border:2px dashed var(--line);background:none;border-radius:12px;padding:14px 16px;font-size:18px;color:var(--blue);font-weight:700}
.more:hover{border-color:var(--blue)}
.worth{text-align:center;margin:0;color:var(--ink2);font-size:16px}
.worth b{color:var(--amber);letter-spacing:.1em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{min-height:68px;border:2px solid var(--line);background:var(--panel2);border-radius:14px;font-size:21px;font-weight:700;padding:10px;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--sage);background:var(--sage-bg);color:var(--sage)}
.opt.wrong{border-color:var(--rust);background:var(--rust-bg);color:var(--rust)}
.opt.dim{opacity:.4}

/* answer */
.result{border-radius:16px;overflow:hidden;border:2px solid var(--line);background:var(--panel);animation:pop .25s ease-out}
.result .hd{padding:18px 18px 14px}
.result .hd.ok{background:var(--sage-bg)}
.result .hd.no{background:var(--rust-bg)}
.result .big{font-family:var(--f-display);font-weight:600;font-size:30px;margin:0}
.hd.ok .big{color:var(--sage)} .hd.no .big{color:var(--rust)}
.result .hd p{margin:4px 0 0;font-size:18px}
.trick{margin:0;padding:14px 18px;border-top:2px solid var(--line);font-family:var(--f-mono);font-size:18px;color:var(--amber)}
.facts{margin:0;padding:0}
.facts div{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:12px 18px;border-top:2px solid var(--line)}
.facts dt{font-weight:700;color:var(--blue);font-size:16px}
.facts dd{margin:0;font-size:17px;min-width:0}

/* end */
.score{font-family:var(--f-display);font-weight:600;font-size:64px;line-height:1;margin:0;text-align:center}
.score small{display:block;font-size:20px;font-weight:400;color:var(--ink2);margin-top:8px}
.list{display:grid;gap:8px}
.list div{background:var(--panel);border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.list b{font-size:19px}
.list span{font-family:var(--f-mono);color:var(--amber);font-size:15px}

@media (max-width:480px){
  body{font-size:17px}
  .opts{grid-template-columns:1fr}
  .facts div{grid-template-columns:1fr;gap:2px}
}

/* ---------- detective layer ---------- */
.badge-row{display:flex;align-items:center;gap:14px}
.badge-row svg{flex:none}
.namebox{display:grid;gap:6px}
.namebox label{font-weight:700;font-size:17px}
.namebox input{font:inherit;font-size:20px;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:14px 16px;width:100%}
.namebox input:focus{border-color:var(--blue);outline:none}
.file{position:relative;background:#2a2519;border:2px solid #5a4c30;border-radius:4px 14px 14px 14px;padding:18px 18px 16px;margin-top:14px}
.file::before{content:"";position:absolute;top:-16px;left:-2px;width:150px;height:16px;background:#2a2519;border:2px solid #5a4c30;border-bottom:0;border-radius:8px 8px 0 0}
.file .tab{position:absolute;top:-14px;left:12px;font-family:var(--f-mono);font-size:13px;letter-spacing:.12em;color:var(--amber)}
.file .conf{position:absolute;top:12px;right:14px;font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;color:#e39a7a;border:2px solid #e39a7a88;border-radius:4px;padding:1px 6px;transform:rotate(4deg)}
.file .story{margin:6px 0 0;font-size:21px;line-height:1.45;color:#f6eedb;padding-right:92px}
.clue{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.clue svg{margin-top:4px}
.more{display:flex;align-items:center;justify-content:center;gap:10px}
.lineup-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.lineup-h h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:24px}
.opt{display:flex;align-items:center;gap:12px;text-align:left}
.av{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:18px;color:#10131a}
.opt .who{display:grid;line-height:1.2;min-width:0}
.opt .who small{font-size:13px;font-weight:400;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.opt.right .who small,.opt.wrong .who small{color:inherit}
.result{position:relative}
.stamp{position:absolute;top:14px;right:14px;font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:.12em;border:3px solid;border-radius:6px;padding:4px 10px;transform:rotate(-10deg);animation:stamp .35s cubic-bezier(.2,1.6,.4,1) both}
.stamp.ok{color:var(--sage);border-color:var(--sage)}
.stamp.no{color:var(--rust);border-color:var(--rust)}
@keyframes stamp{from{transform:rotate(-10deg) scale(2.2);opacity:0}to{transform:rotate(-10deg) scale(1);opacity:1}}
.result .hd{padding-right:150px}
.streak{color:var(--amber)}
.roll{margin:0;padding:10px 18px;border-top:2px solid var(--line);font-weight:700;color:var(--amber)}
.rank{display:grid;justify-items:center;gap:6px;text-align:center}
.rank .r{font-family:var(--f-display);font-weight:600;font-size:30px;margin:0;color:var(--amber)}
.rank p{margin:0;color:var(--ink2)}
@media (max-width:480px){.file .story{padding-right:0;padding-top:22px}.result .hd{padding-right:18px;padding-top:58px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* Each chemical: 4 clues (easy to hard order), plus short facts. */
const C = {
  dopamine:{name:"Dopamine",kind:"Neurotransmitter",
    clues:["I am a neurotransmitter.","I am strongly involved in reward and motivation.","I am also involved in movement.","Neurons in the substantia nigra and VTA make me."],
    from:"Neurons in the substantia nigra and ventral tegmental area (VTA)",to:"Brain pathways for reward, motivation, movement and attention",
    job:"Reward, motivation, movement and attention",off:"Low activity in the substantia nigra is linked with Parkinson’s disease. Unusual signaling in some pathways is linked with schizophrenia and addiction.",
    trick:"Dopamine = Drive & Reward"},
  serotonin:{name:"Serotonin",kind:"Neurotransmitter",
    clues:["I am a neurotransmitter.","A lot of me is made in the gut, not only the brain.","I am linked with mood, sleep and appetite.","Antidepressants called SSRIs keep me around longer."],
    from:"Neurons in the brainstem, and the gut",to:"Receptors all over the brain and body",
    job:"Mood, sleep, appetite and digestion",off:"Unusual serotonin signaling is linked with depression and anxiety. It is not the single cause.",
    trick:"Serotonin = Stability"},
  norepinephrine:{name:"Norepinephrine",kind:"Neurotransmitter",
    clues:["I am a neurotransmitter.","The locus coeruleus in the brainstem releases me.","I make you alert and ready to pay attention.","My hormone cousin from the adrenal glands has a similar name."],
    from:"The locus coeruleus (brainstem) and sympathetic nerves",to:"Brain and body systems for attention, alertness and stress",
    job:"Alertness, attention, arousal and stress response",off:"Unusual signaling is linked with mood disorders, anxiety and attention problems.",
    trick:"Norepinephrine = Notice & React"},
  glutamate:{name:"Glutamate",kind:"Neurotransmitter",
    clues:["I am a neurotransmitter.","I am found almost everywhere in the brain and spinal cord.","I make neurons MORE likely to fire.","I am the brain’s main “go” signal."],
    from:"Neurons all over the brain and spinal cord",to:"Other neurons, making them more likely to fire",
    job:"Main excitatory (“go”) signal; learning and memory",off:"Too much excitement in the brain is linked with seizures and can damage neurons.",
    trick:"Glutamate = GO"},
  gaba:{name:"GABA",kind:"Neurotransmitter",
    clues:["I am a neurotransmitter.","I make neurons LESS likely to fire.","Alcohol and anti-anxiety medicines boost my effects.","I am the brain’s main “brake” signal."],
    from:"Neurons all over the brain",to:"Other neurons, making them less likely to fire",
    job:"Main inhibitory (“brake”) signal; calms neural activity",off:"Unusual GABA signaling is linked with anxiety and seizures.",
    trick:"GABA = BRAKE"},
  endorphins:{name:"Endorphins",kind:"Neuropeptide",
    clues:["I am a neuropeptide, a small protein messenger.","The brain and pituitary gland make me.","I attach to opioid receptors.","I am your body’s natural pain reliever."],
    from:"The brain and pituitary gland",to:"Opioid receptors in the brain and spinal cord",
    job:"Reduce pain; can add a feeling of well-being",off:"This system is tied to pain and reward. Opioid drugs use the same receptors, which links it to addiction.",
    trick:"Endorphins = End the Pain"},
  substanceP:{name:"Substance P",kind:"Neuropeptide",
    clues:["I am a neuropeptide, a small protein messenger.","Sensory neurons release me.","I work in the spinal cord on NK1 receptors.","I carry pain signals."],
    from:"Sensory neurons that sense harm",to:"The spinal cord and pain pathways",
    job:"Sends pain signals; adds to inflammation",off:"Studied in chronic (long-lasting) pain and inflammation.",
    trick:"Substance P = Pain"},
  ach:{name:"Acetylcholine",kind:"Neurotransmitter",
    clues:["I am a neurotransmitter.","Motor neurons release me where nerves meet muscles.","I make your muscles move.","Losing the neurons that make me is linked with Alzheimer’s disease."],
    from:"Motor neurons and brain neurons",to:"Muscles, and brain areas for learning and memory",
    job:"Muscle movement, attention, learning and memory",off:"Loss of acetylcholine neurons is strongly linked with Alzheimer’s disease.",
    trick:"Acetylcholine = Action + Attention"},
  adrenaline:{name:"Adrenaline",kind:"Hormone",
    clues:["I am a hormone.","The adrenal glands (above your kidneys) release me.","I travel in the blood to your heart and lungs.","I get your body ready for fight-or-flight."],
    from:"The adrenal glands (adrenal medulla)",to:"Heart, lungs, blood vessels and liver, through the blood",
    job:"Faster heartbeat and breathing; fight-or-flight",off:"Too much for too long can cause a racing heart, sweating and feeling on edge.",
    trick:"Adrenaline = Alarm"},
  leptin:{name:"Leptin",kind:"Hormone",
    clues:["I am a hormone.","Fat cells make me.","I tell the hypothalamus how much energy is stored.","When the brain stops listening to me, appetite control goes off balance."],
    from:"Fat cells",to:"The hypothalamus in the brain, through the blood",
    job:"Reports stored energy; helps control appetite",off:"In leptin resistance the brain stops responding well. This is linked with obesity.",
    trick:"Leptin = Let’s stop eating"},
  ghrelin:{name:"Ghrelin",kind:"Hormone",
    clues:["I am a hormone.","Your stomach makes me.","My level rises before meals.","I make you feel hungry."],
    from:"The stomach",to:"The hypothalamus in the brain, through the blood",
    job:"Makes you hungry",off:"Studied in obesity and eating disorders.",
    trick:"Ghrelin = Growling stomach"},
  melatonin:{name:"Melatonin",kind:"Hormone",
    clues:["I am a hormone.","The pineal gland makes me.","Darkness increases me; bright light lowers me.","I tell your body it is night and time to sleep."],
    from:"The pineal gland",to:"The body clock (circadian system), through the blood",
    job:"Controls the sleep-wake cycle",off:"Bad timing is linked with sleep problems, jet lag and night-shift tiredness.",
    trick:"Melatonin = Midnight"},
  oxytocin:{name:"Oxytocin",kind:"Hormone",
    clues:["I am a hormone.","The hypothalamus makes me and the pituitary gland releases me.","I help with childbirth and breastfeeding.","I am involved in bonding and attachment."],
    from:"The hypothalamus, released by the posterior pituitary",to:"The uterus, milk glands and the brain",
    job:"Childbirth, breastfeeding, bonding",off:"Its effects on social behavior depend on the situation. It is not just a “love hormone.”",
    trick:"Oxytocin = Connection"}
};
/* Chemicals people mix up, used as wrong choices */
const MIX = {glutamate:["gaba"],gaba:["glutamate"],leptin:["ghrelin"],ghrelin:["leptin"],dopamine:["serotonin","ach"],serotonin:["dopamine"],
  adrenaline:["norepinephrine","melatonin"],norepinephrine:["adrenaline"],endorphins:["substanceP"],substanceP:["endorphins"],
  melatonin:["adrenaline"],ach:["dopamine"],oxytocin:["endorphins"]};
const IDS = Object.keys(C);
const KEY = "nns-detective-v2";

const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const starStr = n => "★".repeat(n)+"☆".repeat(3-n);
function best(){try{return +localStorage.getItem(KEY)||0;}catch(e){return 0;}}
function saveBest(n){try{if(n>best())localStorage.setItem(KEY,n);}catch(e){}}

function choicesFor(id){
  const kind = c => C[c].kind==="Hormone"?"h":"n";
  const out = shuffle(MIX[id]||[]).slice(0,2);
  const same = shuffle(IDS.filter(x=>x!==id&&!out.includes(x)&&kind(x)===kind(id)));
  const other = shuffle(IDS.filter(x=>x!==id&&!out.includes(x)&&kind(x)!==kind(id)));
  const pool = same.concat(other);
  while(out.length<3) out.push(pool.shift());
  return shuffle([id,...out]);
}


/* The mystery for each case */
const STORY = {
  dopamine:"Someone in Brain City keeps handing out rewards. Now everyone wants to do the same thing again and again!",
  serotonin:"One quiet worker is helping manage Brain City’s moods, sleep and snack times. Who is it?",
  norepinephrine:"Suddenly every neuron in Brain City is wide awake and paying close attention. Who flipped the alert switch?",
  glutamate:"Neurons all over Brain City are firing more and more. Someone pressed the gas pedal!",
  gaba:"Everything in Brain City is calming down and slowing down. Someone hit the brakes!",
  endorphins:"A marathon runner should be hurting, but the pain is fading away. Who stepped in to help?",
  substanceP:"Ouch! Someone touched a hot pan, and a pain message raced into the spinal cord. Who delivered it?",
  ach:"A message just jumped from a nerve to a muscle, and the arm moved. Who carried it?",
  adrenaline:"Footsteps in a dark alley! Hearts are pounding and lungs are pumping. Who sounded the alarm?",
  leptin:"A message from fat cells told the brain: we have plenty of energy stored. Who sent it?",
  ghrelin:"It’s been hours since lunch and stomachs are growling all over town. Who is behind the hunger?",
  melatonin:"The sun went down and all of Brain City is getting sleepy. Who dimmed the lights?",
  oxytocin:"A parent and a newborn baby are forming a strong bond. Who is helping them connect?"
};
const AVC = ["#9db6dc","#b9a8e0","#9fd0ac","#e6be7a"];
const RANKS = [[0,"Rookie Detective","Every great detective starts somewhere."],[10,"Junior Detective","You’re getting the hang of this."],[20,"Senior Detective","Sharp eyes. The brain can’t hide much from you."],[30,"Chief Detective","Brain City is safer with you on the case."],[36,"Master Sleuth","Legendary. You cracked almost every case on the first clue."]];
const ICON = {
  glass:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="M15 15l6 6"/></svg>`,
  badge:(size,color)=>`<svg width="${size}" height="${size}" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 3l7 7 10-1 2 10 8 6-5 9 5 9-8 6-2 10-10-1-7 7-7-7-10 1-2-10-8-6 5-9-5-9 8-6 2-10 10 1z" fill="${color}" fill-opacity=".18" stroke="${color}" stroke-width="2.5"/><path d="M32 18l4.2 8.6 9.4 1.3-6.8 6.6 1.6 9.4L32 39.5l-8.4 4.4 1.6-9.4-6.8-6.6 9.4-1.3z" fill="${color}"/></svg>`
};
function rankFor(stars){let r=RANKS[0];RANKS.forEach(x=>{if(stars>=x[0])r=x;});return r;}
function getName(){try{return localStorage.getItem(KEY+"-name")||"";}catch(e){return "";}}
function setName(n){try{localStorage.setItem(KEY+"-name",n);}catch(e){}}

let G = null;
const app = document.getElementById("app");

function home(){
  G = null;
  const b = best(), nm = getName();
  app.innerHTML = `
    <div class="badge-row">${ICON.badge(64,"#e6be7a")}<h1 class="title" style="margin:0">NEURAL<br><span>NIGHT SHIFT</span></h1></div>
    <p class="lead">Strange things are happening inside Brain City. You’re the detective on the night shift. Read the evidence and catch the brain chemical behind each case.</p>
    <ul class="steps">
      <li><b>1</b>Read the mystery and the first clue.</li>
      <li><b>2</b>Stuck? Tap <strong>Search for another clue</strong>.</li>
      <li><b>3</b>Accuse a suspect. Fewer clues = more stars ★</li>
    </ul>
    <div class="namebox"><label for="detName">Your detective name</label><input id="detName" maxlength="20" autocomplete="off" placeholder="Detective Sam" value="${esc(nm)}"></div>
    <button class="btn" data-act="start" id="startBtn">Start my shift</button>
    ${b?`<p class="best">Your best: ${b} ★ out of 39 · ${esc(rankFor(b)[1])}</p>`:""}`;
}
const det = () => G&&G.name?`Detective ${G.name}`:"Detective";

function start(){
  const inp=document.getElementById("detName");
  let nm = inp?inp.value.trim().replace(/^detective\s+/i,""):(G?G.name:getName());
  setName(nm);
  G = {order:shuffle(IDS),i:0,stars:0,results:[],streak:0,name:nm};
  newCase();
}
function newCase(){
  const id = G.order[G.i];
  G.cur = {id,shown:1,choices:choicesFor(id),picked:null};
  draw();
  window.scrollTo(0,0);
}
function draw(){
  const c = G.cur, ch = C[c.id], done = c.picked!==null;
  const worth = c.shown<=1?3:c.shown===2?2:1;
  const clues = ch.clues.slice(0, done?ch.clues.length:c.shown).map((t,i)=>`<div class="clue">${ICON.glass}<div><small>EVIDENCE #${i+1}</small><p>${esc(t)}</p></div></div>`).join("");
  const opts = c.choices.map((id,i)=>{
    let cls="opt";
    if(done){ if(id===c.id)cls+=" right"; else if(id===c.picked)cls+=" wrong"; else cls+=" dim"; }
    const tag = done?(id===c.id?"Culprit":id===c.picked?"Innocent":""):"Suspect "+(i+1);
    return `<button class="${cls}" data-pick="${id}" ${done?"disabled":""}><span class="av" style="background:${AVC[i]}">${esc(C[id].name.slice(0,2))}</span><span class="who">${esc(C[id].name)}<small>${tag}</small></span></button>`;
  }).join("");
  let result = "";
  if(done){
    const ok = c.picked===c.id, got = G.results[G.results.length-1].stars;
    const cheers = ["Nice work","Great detective work","Case cracked","Sharp eyes"];
    result = `<section class="result" id="result">
      <span class="stamp ${ok?"ok":"no"}">${ok?"CASE CLOSED":"WRONG SUSPECT"}</span>
      <div class="hd ${ok?"ok":"no"}">
        <p class="big">${ok?starStr(got):"Not quite"}</p>
        <p>${ok?`${cheers[G.i%4]}, ${esc(det())}! It was <b>${esc(ch.name)}</b>.`:`${esc(C[c.picked].name)} is innocent. The real culprit was <b>${esc(ch.name)}</b>.`}</p>
      </div>
      ${ok&&G.streak>=3?`<p class="roll">${G.streak} cases in a row. You’re on a roll!</p>`:""}
      <p class="trick">Remember: ${esc(ch.trick)}</p>
      <dl class="facts">
        <div><dt>What is it?</dt><dd>${esc(ch.kind)}</dd></div>
        <div><dt>Made in</dt><dd>${esc(ch.from)}</dd></div>
        <div><dt>Goes to</dt><dd>${esc(ch.to)}</dd></div>
        <div><dt>Job</dt><dd>${esc(ch.job)}</dd></div>
        <div><dt>If it goes wrong</dt><dd>${esc(ch.off)}</dd></div>
      </dl>
    </section>
    <button class="btn" data-act="next" id="nextBtn">${G.i+1<G.order.length?"Next case →":"See my detective rank →"}</button>`;
  }
  app.innerHTML = `
    <div class="top"><span>${esc(det())}</span><span>${G.streak?`<span class="streak">Streak ${G.streak}</span> · `:""}<span class="stars">${G.stars} ★</span></span></div>
    <div class="track"><i style="--p:${G.i/G.order.length}"></i></div>
    <div class="file"><span class="tab">CASE #${String(G.i+1).padStart(2,"0")} OF ${G.order.length}</span><span class="conf">TOP SECRET</span>
      <p class="story">${esc(STORY[c.id])}</p></div>
    <div class="clues">${clues}</div>
    ${!done&&c.shown<ch.clues.length?`<button class="more" data-act="clue">${ICON.glass} Search for another clue</button>`:""}
    <div class="lineup-h"><h3>${done?"The lineup":"Who did it?"}</h3>${!done?`<p class="worth">Accuse now for <b>${starStr(worth)}</b></p>`:""}</div>
    <div class="opts">${opts}</div>
    ${result}`;
  if(done){const r=document.getElementById("result");r.scrollIntoView({behavior:"smooth",block:"start"});}
}
function pick(id){
  const c = G.cur; if(c.picked!==null) return;
  c.picked = id;
  const ok = id===c.id, s = ok?(c.shown<=1?3:c.shown===2?2:1):0;
  G.stars += s;
  G.streak = ok?G.streak+1:0;
  G.results.push({id:c.id,ok,stars:s});
  draw();
}
function end(){
  saveBest(G.stars);
  const right = G.results.filter(r=>r.ok).length;
  const missed = G.results.filter(r=>!r.ok);
  const [,rk,msg] = rankFor(G.stars);
  app.innerHTML = `
    <div class="rank">${ICON.badge(110,"#e6be7a")}
      <p style="font-family:var(--f-mono);letter-spacing:.14em;color:var(--muted)">SHIFT COMPLETE</p>
      <p class="r">${esc(rk)}</p>
      <p>${esc(det())}, ${esc(msg.charAt(0).toLowerCase()+msg.slice(1))}</p></div>
    <p class="score">${G.stars} ★<small>${right} of ${G.results.length} cases solved</small></p>
    ${missed.length?`<h2 style="font-size:22px">Cold cases to practice</h2>
      <div class="list">${missed.map(r=>`<div><b>${esc(C[r.id].name)}</b><span>${esc(C[r.id].trick)}</span></div>`).join("")}</div>`
      :`<p class="lead" style="text-align:center">Every case solved. Brain City thanks you!</p>`}
    <button class="btn" data-act="again" id="againBtn">Start another shift</button>
    <button class="btn soft" data-act="home">Home</button>`;
  window.scrollTo(0,0);
}

document.addEventListener("click",e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.pick){pick(b.dataset.pick);return;}
  const a = b.dataset.act;
  if(a==="start") start();
  else if(a==="again"){const n=G.name;G={name:n};start();}
  else if(a==="home") home();
  else if(a==="clue"){G.cur.shown++;draw();}
  else if(a==="next"){G.i++; G.i<G.order.length?newCase():end();}
});

home();
</script>
</body>
</html>
