<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="An AP Psychology study game for 13 neurotransmitters and hormones.">
<title>Neural Night Shift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@300;400;500;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: a quiet night-lab console. One centered column of "case files", a thin instrument bar on top, mono readouts for data. */
:root{
  color-scheme: dark;
  --bg:#0c0e13;          /* almost-black, navy bias */
  --bg2:#10141c;
  --panel:#151a24;       /* charcoal-navy surfaces */
  --panel2:#1b2130;
  --line:#2a3242;
  --line2:#36405400;
  --ink:#ebe6da;         /* warm off-white */
  --ink2:#b9b6ad;
  --muted:#7f8798;
  --blue:#8aa3c8;        /* muted blue: signals, focus */
  --violet:#a092c4;      /* muted purple: hormones */
  --sage:#93b79d;        /* correct */
  --sage-bg:#93b79d1a;
  --rust:#c98466;        /* not quite */
  --rust-bg:#c984661a;
  --amber:#c9a46a;       /* stars, small accents */
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
::selection{background:#8aa3c855;color:var(--ink)}
html{scrollbar-color:var(--line) var(--bg);accent-color:var(--blue);font-variant-numeric:tabular-nums}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0;
  background:radial-gradient(1200px 600px at 50% -200px,#1a2133 0%,transparent 70%),var(--bg);min-height:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#0c0e13e6;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:500;letter-spacing:.22em;font-size:13px;background:none;border:0;padding:4px 0;color:var(--ink);white-space:nowrap}
.brand i{font-style:normal;color:var(--blue)}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{background:none;border:1px solid transparent;border-radius:6px;padding:6px 10px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--ink2)}
.nav button:hover{color:var(--ink);border-color:var(--line)}
.nav button[aria-current="page"]{color:var(--ink);border-color:var(--line);background:var(--panel)}
.prog{margin-left:auto;display:flex;align-items:center;gap:12px}
.prog-txt{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--ink2);text-align:right;line-height:1.3}
.prog-txt b{color:var(--ink);font-weight:500}
.prog-txt span{display:block;color:var(--muted)}
.snd{background:none;border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--muted)}
.bar{height:2px;background:var(--line);position:relative}
.bar i{position:absolute;inset:0;width:100%!important;background:linear-gradient(90deg,var(--blue),var(--sage));transform-origin:left;transform:scaleX(var(--p,0));transition:transform .5s cubic-bezier(.16,1,.3,1)}

main{max-width:1040px;margin:0 auto;padding:28px 16px 64px}

/* ---------- home ---------- */
.home{display:grid;gap:28px;padding-block:24px 8px;text-align:left}
.scope{width:100%;height:86px;display:block;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:
  repeating-linear-gradient(90deg,transparent 0 39px,#ffffff08 39px 40px)}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;color:var(--blue)}
h1.title{font-family:var(--f-display);font-weight:300;font-size:clamp(40px,9vw,92px);letter-spacing:.06em;line-height:.95;margin:6px 0 0;text-wrap:balance}
h1.title b{font-weight:600}
.sub{font-family:var(--f-display);font-size:clamp(18px,2.6vw,24px);color:var(--ink2);margin:10px 0 0;font-weight:300;letter-spacing:.02em}
.desc{max-width:58ch;color:var(--ink2);margin:0}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:12px 18px;font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--ink);color:#0c0e13;border-color:var(--ink)}
.btn.primary:hover{background:#fff}
.btn.ghost{background:none}
.btn.small{padding:8px 12px;font-size:11px}
.btn.danger{border-color:#c9846655;color:var(--rust);background:none}
.home-meta{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;border-top:1px solid var(--line);padding-top:16px}
.mastery-strip{display:flex;gap:4px;flex-wrap:wrap}
.mastery-strip i{width:22px;height:8px;border-radius:2px;background:var(--line)}
.mastery-strip i.learning{background:#8aa3c866}
.mastery-strip i.mastered{background:var(--sage)}
.foot{font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;color:var(--muted);text-align:center;margin-top:40px}

/* ---------- headings ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.ph h2{font-family:var(--f-display);font-weight:400;letter-spacing:.08em;font-size:clamp(24px,4vw,34px);margin:4px 0 0;text-transform:uppercase;text-wrap:balance}
.ph p{margin:6px 0 0;color:var(--ink2);max-width:60ch}

/* ---------- hub ---------- */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{background:none;border:0;padding:9px 14px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--ink)}
.seg button+button{border-left:1px solid var(--line)}
.diffnote{font-size:14px;color:var(--muted);margin:8px 0 0}
.modes{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.mode{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:16px 18px;background:none;border:0;border-top:1px solid var(--line);text-align:left;width:100%}
.mode:first-child{border-top:0}
.mode:hover{background:var(--panel2)}
.mode .k{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.mode h3{margin:0;font-family:var(--f-display);font-weight:500;letter-spacing:.08em;font-size:17px;text-transform:uppercase}
.mode p{margin:2px 0 0;color:var(--ink2);font-size:14px}
.mode .tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:3px 6px;white-space:nowrap}
.mode.featured h3{color:var(--ink)}
.mode.featured .k{color:var(--blue)}
.hub-grid{display:grid;gap:20px}
.callout{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;background:var(--bg2)}
.callout p{margin:0;color:var(--ink2);font-size:14px}

/* ---------- case ---------- */
.case{max-width:720px;margin:0 auto;display:grid;gap:18px}
.case-head{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.case-head .no{color:var(--ink)}
.case-head .sp{margin-left:auto}
.case-head button{background:none;border:0;color:var(--muted);font:inherit;letter-spacing:inherit;padding:0}
.case-head button:hover{color:var(--ink)}
.pips{display:flex;gap:3px}
.pips i{width:14px;height:3px;background:var(--line);border-radius:2px}
.pips i.ok{background:var(--sage)}.pips i.no{background:var(--rust)}.pips i.cur{background:var(--ink2)}
.prompt{font-family:var(--f-display);font-weight:400;font-size:clamp(20px,3.4vw,27px);line-height:1.32;margin:0;text-wrap:pretty}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;align-items:center;gap:12px;min-height:58px;padding:12px 16px;border:1px solid var(--line);background:var(--panel);border-radius:9px;text-align:left;font-size:16px;transition:border-color .12s,background .12s,transform .08s}
.opt:hover:not(:disabled){border-color:var(--blue);background:var(--panel2)}
.opt:active:not(:disabled){transform:scale(.99)}
.opt .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;width:22px;height:22px;display:grid;place-items:center;flex:none}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--sage);background:var(--sage-bg)}
.opt.right .n{border-color:var(--sage);color:var(--sage)}
.opt.wrong{border-color:var(--rust);background:var(--rust-bg)}
.opt.wrong .n{border-color:var(--rust);color:var(--rust)}
.opt.dim{opacity:.45}
.opt .lab{min-width:0}

/* reveal */
.reveal{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden;animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
.rv-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.rv-head h3{margin:0;font-family:var(--f-display);font-weight:600;letter-spacing:.12em;font-size:22px;text-transform:uppercase}
.rv-head.ok h3{color:var(--sage)}
.rv-head.no h3{color:var(--rust)}
.rv-head .note{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.miss{padding:16px 18px;border-bottom:1px solid var(--line);background:var(--rust-bg);display:grid;gap:8px}
.miss p{margin:0}
.remember{font-family:var(--f-mono);font-size:13px;letter-spacing:.06em;color:var(--ink);background:#0c0e1380;border:1px dashed var(--line);border-radius:6px;padding:8px 10px}
.remember span{color:var(--muted);font-size:11px;letter-spacing:.14em;display:block;margin-bottom:2px}
.profile{display:grid;grid-template-columns:132px 1fr;margin:0}
.profile dt,.profile dd{padding:10px 18px;border-top:1px solid var(--line);margin:0}
.profile dt:first-of-type,.profile dd:first-of-type{border-top:0}
.profile dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--muted);padding-top:13px}
.profile dd{color:var(--ink);min-width:0}
.profile dd.memory{font-family:var(--f-mono);color:var(--amber)}
.profile .flow{color:var(--muted);font-size:13px;display:block;margin-top:2px}
.rv-foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.rv-foot .hint{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.08em}

/* type chips */
.chip{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;border-radius:4px;padding:3px 7px;border:1px solid;display:inline-block;white-space:nowrap}
.chip.nt{color:var(--blue);border-color:#8aa3c855}
.chip.hormone{color:var(--violet);border-color:#a092c455}
.state{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;border-radius:20px;padding:3px 9px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.state.learning{color:var(--blue);border-color:#8aa3c855}
.state.mastered{color:var(--sage);border-color:#93b79d66;background:var(--sage-bg)}

/* trace path */
.trace{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--bg2)}
.node{border:1px solid var(--line);border-radius:8px;padding:10px 10px;text-align:center;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;background:var(--panel);min-width:0;overflow-wrap:anywhere}
.node small{display:block;color:var(--muted);font-size:11px;letter-spacing:.16em;margin-bottom:4px}
.node.q{border-style:dashed;color:var(--blue);font-size:22px;padding:6px}
.node.q.hit{border-style:solid;font-size:12px;padding:10px;color:var(--sage);border-color:var(--sage)}
.arrow{color:var(--muted);font-family:var(--f-mono)}
.via{grid-column:1/-1;text-align:center;font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}

/* detective */
.clues{display:grid;gap:8px;counter-reset:c}
.clue{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:baseline;border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:var(--bg2);animation:rise .2s ease-out}
.clue span{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--muted)}
.clue p{margin:0;font-size:17px}
.clue.hidden{border-style:dashed;color:var(--muted);background:none}
.stars{color:var(--amber);letter-spacing:.2em;font-family:var(--f-mono)}
.stars s{color:var(--line);text-decoration:none}

/* balance gauge */
.gauge{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 12px;background:var(--bg2)}
.g-ends{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12px;letter-spacing:.14em}
.g-ends .brk{color:var(--rust)} .g-ends .go{color:var(--sage)}
.g-ends small{display:block;color:var(--muted);font-size:11px;letter-spacing:.1em}
.g-track{position:relative;height:10px;margin:10px 0 6px;border-radius:5px;background:linear-gradient(90deg,#c9846655,#2a3242 45%,#2a3242 55%,#93b79d55)}
.g-needle{position:absolute;top:-5px;width:2px;height:20px;background:var(--ink);left:50%;transition:left .5s cubic-bezier(.3,.7,.2,1)}
.g-read{text-align:center;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}

/* timer */
.timer{display:flex;align-items:center;gap:12px}
.timer .t{font-family:var(--f-mono);font-size:28px;font-variant-numeric:tabular-nums;min-width:3ch}
.timer .tb{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.timer .tb i{display:block;height:100%;width:100%!important;background:var(--blue);transform-origin:left;transform:scaleX(var(--p,1));transition:transform 1s linear}
.timer.low .t{color:var(--rust)} .timer.low .tb i{background:var(--rust)}
.flash-ok{animation:fok .35s}
.flash-no{animation:fno .35s}
@keyframes fok{0%{box-shadow:0 0 0 0 #93b79d55}100%{box-shadow:0 0 0 12px transparent}}
@keyframes fno{0%,100%{transform:none}30%{transform:translateX(-4px)}60%{transform:translateX(4px)}}

/* report */
.report{max-width:720px;margin:0 auto;display:grid;gap:18px}
.rep-card{border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.rep-row{display:grid;grid-template-columns:170px 1fr;gap:12px;padding:14px 18px;border-top:1px solid var(--line);align-items:baseline}
.rep-row:first-child{border-top:0}
.rep-row .v{font-family:var(--f-display);font-size:19px;min-width:0}
.big{font-family:var(--f-display);font-weight:300;font-size:clamp(44px,8vw,72px);line-height:1;letter-spacing:.02em}
.big small{font-size:.4em;color:var(--muted)}
.names{display:flex;flex-wrap:wrap;gap:6px}
.names span{border:1px solid var(--line);border-radius:4px;padding:2px 8px;font-size:15px}
.names.good span{border-color:#93b79d55;color:var(--sage)}
.names.weak span{border-color:#c9846655;color:var(--rust)}

/* lab */
.lab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-items:start}
.group-h{display:flex;align-items:baseline;gap:12px;margin:26px 0 12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.group-h h3{margin:0;font-family:var(--f-display);font-weight:500;letter-spacing:.14em;font-size:15px}
.group-h p{margin:0;color:var(--muted);font-size:13px}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
.card summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;gap:6px}
.card summary::-webkit-details-marker{display:none}
.card .row1{display:flex;align-items:center;gap:8px;justify-content:space-between}
.card .nm{font-family:var(--f-display);font-weight:500;font-size:20px;letter-spacing:.04em}
.card .mm{font-family:var(--f-mono);font-size:12px;color:var(--amber)}
.card .facets{display:flex;gap:4px;flex-wrap:wrap}
.card .facets i{font-style:normal;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;padding:2px 5px;border-radius:3px;border:1px solid var(--line);color:var(--muted)}
.card .facets i.on{color:var(--sage);border-color:#93b79d55}
.card .more{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--muted)}
.card[open] .more{display:none}
.card .profile{grid-template-columns:110px 1fr;border-top:1px solid var(--line);font-size:14.5px}
.card .profile dt,.card .profile dd{padding:9px 14px}
.ovd{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ovd>div{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--bg2)}
.ovd h4{margin:0 0 4px;font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;color:var(--blue);font-weight:500}
.ovd p{margin:0;font-size:14.5px;color:var(--ink2)}

/* table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:860px;font-size:14px}
th{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:500;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--bg2);position:sticky;top:0}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
tr.main{cursor:pointer}
tr.main:hover td{background:var(--panel2)}
tr.main td:first-child{font-family:var(--f-display);font-weight:500;font-size:16px;white-space:nowrap}
tr.main td:first-child::before{content:"+ ";font-family:var(--f-mono);color:var(--muted)}
tr.main.open td:first-child::before{content:"− "}
tr.ext td{background:var(--bg2);color:var(--ink2)}
tr.ext b{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:500;margin-right:6px}

/* log */
.log{display:grid;gap:10px}
.entry{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:14px 16px;display:grid;gap:10px}
.entry .q{margin:0;font-size:15px;color:var(--ink2)}
.entry .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.entry .pair div{border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.entry .pair .c1{border-color:#c9846655}.entry .pair .c2{border-color:#93b79d55}
.entry .pair b{display:block;font-weight:400;font-size:16px}
.entry .pair .c1 b{color:var(--rust)}.entry .pair .c2 b{color:var(--sage)}
.entry .why{margin:0;font-size:15px}
.entry .ft{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--ink2)}

/* how */
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.how>div{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--panel)}
.how h4{margin:0 0 6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--blue);font-weight:500}
.how p{margin:0;color:var(--ink2);font-size:15px}
.loop{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em}
.loop span{border:1px solid var(--line);border-radius:4px;padding:5px 8px}
.loop em{font-style:normal;color:var(--muted)}

/* modal */
.modal{position:fixed;inset:0;background:#05060acc;display:grid;place-items:center;padding:16px;z-index:50}
.modal>div{max-width:420px;width:100%;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:20px;display:grid;gap:14px}
.modal h3{margin:0;font-family:var(--f-display);letter-spacing:.1em;font-weight:500}
.modal p{margin:0;color:var(--ink2)}
.modal .act{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

@media (max-width:640px){
  body{font-size:15.5px}
  .top-in{gap:8px 12px;padding:8px 16px}
  .brand{font-size:11px;letter-spacing:.16em}
  .prog-txt span{display:none}
  .nav{order:3;width:100%;justify-content:space-between}
  .nav button{padding:6px 6px;font-size:11px;letter-spacing:.08em}
  .opts{grid-template-columns:1fr}
  .profile{grid-template-columns:1fr}
  .profile dt{padding-bottom:0;border-top:1px solid var(--line)}
  .profile dd{border-top:0;padding-top:4px}
  .profile dt:first-of-type{border-top:0}
  .trace{grid-template-columns:1fr;text-align:center}
  .arrow{transform:rotate(90deg);justify-self:center}
  .rep-row{grid-template-columns:1fr;gap:4px}
  .mode{grid-template-columns:1fr}
  .mode .tag{display:none}
  .ovd,.entry .pair{grid-template-columns:1fr}
  .clue{grid-template-columns:1fr;gap:2px}
  .lab-grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function pickDistractors(id,n,opts={}){
  const avoid = opts.noAvoid?[]:(AVOID[id]||[]);
  const out = shuffle((CONF[id]||[]).filter(x=>!avoid.includes(x))).slice(0,2);
  let rest = IDS.filter(x=>x!==id&&!out.includes(x)&&!avoid.includes(x));
  if(opts.sameCat){const same=rest.filter(x=>C[x].cat===C[id].cat);rest=shuffle(same).concat(shuffle(rest.filter(x=>!same.includes(x))));}
  else rest=shuffle(rest);
  while(out.length<n)out.push(rest.shift());
  return out;
}
function fromBank(r){const [chem,facet,lv,prompt,x]=r;const it={chem,facet,lv,prompt};
  if(x&&x.o){it.kind="text";it.opts=x.o;it.ans=x.o[0];it.why=x.why;}else{it.kind="chem";it.d=x&&x.d;}return it;}
function buildOptions(it){
  if(it.kind==="text")return shuffle(it.opts.map(o=>({label:o,value:o})));
  const ids = it.d?it.d.slice():[it.chem,...pickDistractors(it.chem,3,{noAvoid:it.noAvoid,sameCat:it.sameCat})];
  return shuffle(ids).map(id=>({label:C[id].name,value:id}));
}
const clock = i => {const m=22*60+i*13;const h=Math.floor(m/60)%24,mm=m%60;return String(h).padStart(2,"0")+":"+String(mm).padStart(2,"0");};

  const b = LOC.map(([chem,facet,q,o])=>({chem,facet,kind:"text",prompt:q,opts:o,ans:o[0],loc:facet}));
  return a.concat(b);
}
const balItems = () => BAL.map(([chem,q,d])=>({chem,facet:"func",kind:"chem",prompt:q,gauge:true,d:d||((chem==="glutamate"||chem==="gaba")?["glutamate","gaba",...pickDistractors(chem==="gaba"?"glutamate":"gaba",4).filter(x=>x!=="glutamate"&&x!=="gaba").slice(0,2)]:null)}));
const rapidItems = () => RAPID.map(([chem,q])=>({chem,facet:"id",kind:"chem",prompt:q}));
function spread(items,n){ /* prefer distinct chemicals first */
  const seen=new Set(),first=[],rest=[];shuffle(items).forEach(it=>{if(!seen.has(it.chem)){seen.add(it.chem);first.push(it);}else rest.push(it);});
  return first.concat(rest).slice(0,n).sort(()=>Math.random()-.5);
}

/* oscilloscope trace on the home screen */
let scopeRAF=null;
function startScope(){
  cancelAnimationFrame(scopeRAF);
  const cv=document.getElementById("scope");if(!cv)return;
  const ctx=cv.getContext("2d");const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
  const still=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let t=0;
  function y(x,t){const p=((x+t)%260);let v=Math.sin((x+t)*0.035)*3;
    if(p>120&&p<128)v-=(p-120)*4; else if(p>=128&&p<134)v+=-32+(p-128)*9; else if(p>=134&&p<142)v+=22-(p-134)*2.8;return H/2+v;}
  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle="rgba(138,163,200,0.75)";ctx.lineWidth=1.25;ctx.beginPath();
    for(let x=0;x<=W;x+=2){const yy=y(x,t);x?ctx.lineTo(x,yy):ctx.moveTo(x,yy);}ctx.stroke();
    ctx.fillStyle="rgba(127,135,152,0.9)";ctx.font="10px 'IBM Plex Mono', monospace";
    ctx.fillText("CH1 · −70 mV RESTING · ACTION POTENTIAL",8,14);
    if(!still&&view==="home"){t+=0.6;scopeRAF=requestAnimationFrame(draw);}
  }
  draw();
}

function startMode(key,items){
  const m=MODES[key];
  G={mode:key,title:m.title,items:items||m.build(),i:0,results:[],tally:{},stars:0,cur:null};
  if(key==="rapid"){G.time=60;G.end=Date.now()+60000;}
  view="play";nextItem();window.scrollTo(0,0);
  if(key==="rapid"){tick=setInterval(()=>{const left=Math.max(0,Math.ceil((G.end-Date.now())/1000));G.time=left;const t=document.getElementById("tleft");if(t){t.textContent=left;const tb=document.getElementById("tbar");if(tb)tb.style.setProperty("--p",left/60);document.getElementById("timer").classList.toggle("low",left<=10);}if(left<=0){clearInterval(tick);tick=null;finish();}},250);}
}
function nextItem(){
  if(!G)return;
  if(G.i>=G.items.length||(G.mode!=="rapid"&&G.i>=G.items.length)){finish();return;}
  const it=G.items[G.i];
  G.cur={it,options:buildOptions(it),chosen:null,ok:null,shown:it.clues?1:0};
  render();
}
function answer(val){
  const c=G.cur;if(!c||c.chosen!==null)return;
  const it=c.it;c.chosen=val;
  const ok = it.kind==="text"?val===it.ans:val===it.chem;c.ok=ok;
  const chosenLabel = it.kind==="text"?val:C[val].name;
  const ansLabel = it.kind==="text"?it.ans:C[it.chem].name;
  c.why = whyText(it,val,ok);
  c.remember = rememberLine(it,val);
  let pts=ok?1:0;
  if(it.clues&&ok){pts=c.shown<=1?3:c.shown===2?2:1;G.stars+=pts;}
  record(it,ok,chosenLabel,ansLabel,c.why,c.remember);
  G.results.push({chem:it.chem,ok,stars:it.clues?(ok?pts:0):null});
  blip(ok);
  if(G.mode==="rapid"){
    render();
    setTimeout(()=>{if(G&&view==="play"){G.i++;nextItem();}},ok?320:900);
    return;
  }
  render();
  const r=document.getElementById("reveal");if(r)r.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function whyText(it,val,ok){
  if(ok)return "";
  const A=C[it.chem];
  if(it.kind==="text")return it.why || `The better answer is “${it.ans}”. ${A.name}: ${A.brief}.`;
  const X=C[val];
  return `${X.name} is mainly linked to ${X.brief}. This case pointed to ${A.brief}, which makes ${A.name} the better answer.`;
}
function rememberLine(it,val){
  if(it.kind==="chem"&&val&&val!==it.chem){const p=pairLine(val,it.chem);if(p)return p;return C[it.chem].mem.toUpperCase()+" · "+C[val].mem.toUpperCase();}
  if(it.chem==="glutamate"||it.chem==="gaba")return "GLUTAMATE = GO · GABA = BRAKE";
  return C[it.chem].mem;
}
function record(it,ok,chosenLabel,ansLabel,why,mem){
  const m=S.chem[it.chem];S.answered++;
  const t=G.tally[it.chem]=G.tally[it.chem]||{c:0,w:0};
  if(ok){m.c++;S.correct++;S.score+=10;t.c++;m.f[it.facet]=true;}
  else{m.w++;S.wrong++;t.w++;delete m.f[it.facet];
    S.log.unshift({t:Date.now(),q:it.prompt,chose:chosenLabel,ans:ansLabel,why,mem,chem:it.chem,facet:it.facet});S.log=S.log.slice(0,100);}
  save();renderTop();
}

  let extra="";
  if(G.mode==="rapid"){
    extra=`<div class="timer${G.time<=10?" low":""}" id="timer"><span class="t" id="tleft">${G.time}</span><span class="tb"><i id="tbar" style="--p:${G.time/60}"></i></span><span class="label">${G.results.filter(r=>r.ok).length} / ${G.results.length}</span></div>`;
  }
  if(it.clues){
    const st=c.shown<=1?3:c.shown===2?2:1;
    extra+=`<div class="clues">${it.clues.map((cl,i)=>i<c.shown||done?`<div class="clue"><span>CLUE ${String(i+1).padStart(2,"0")}</span><p>${esc(cl)}</p></div>`:"").join("")}
      ${!done&&c.shown<it.clues.length?`<button class="clue hidden" data-act="clue" style="text-align:left;width:100%"><span>CLUE ${String(c.shown+1).padStart(2,"0")}</span><p style="font-size:14px;font-family:var(--f-mono);letter-spacing:.1em">REVEAL NEXT CLUE →</p></button>`:""}</div>
      ${!done?`<div class="label">Answer now for <span class="stars">${"★".repeat(st)}<s>${"★".repeat(3-st)}</s></span></div>`:""}`;
  }
  if(it.path){
    const isHorm=C[it.chem].cat==="hormone";
    extra+=`<div class="trace"><div class="node"><small>ORIGIN</small>${esc(it.path.from)}</div><span class="arrow">→</span>
      <div class="node q${done?" hit":""}">${done?esc(C[it.chem].name.toUpperCase()):"?"}</div><span class="arrow">→</span>
      <div class="node"><small>DESTINATION</small>${esc(it.path.to)}</div>
      <div class="via">${isHorm?"signal travels through the bloodstream":"signal crosses a synapse to receptors"}</div></div>`;
  }
  if(it.loc){
    const ch=C[it.chem];
    const left=it.loc==="origin"?(done?esc(it.ans.toUpperCase()):"?"):esc(ch.o2.toUpperCase());
    const right=it.loc==="dest"?(done?esc(it.ans.toUpperCase()):"?"):esc(ch.d2.toUpperCase());
    extra+=`<div class="trace"><div class="node${it.loc==="origin"?" q"+(done?" hit":""):""}"><small>ORIGIN</small>${left}</div><span class="arrow">→</span>
      <div class="node" style="color:var(--ink)">${esc(ch.name.toUpperCase())}</div><span class="arrow">→</span>
      <div class="node${it.loc==="dest"?" q"+(done?" hit":""):""}"><small>DESTINATION</small>${right}</div>
      <div class="via">${it.loc==="origin"?"origin = where it is produced or released":"destination = where it acts"}</div></div>`;
  }
  if(it.gauge){
    const pos = !done?50:it.chem==="glutamate"?92:it.chem==="gaba"?8:50;
    const read = !done?"Reading…":it.chem==="glutamate"?"GO · excitatory":it.chem==="gaba"?"BRAKE · inhibitory":`Not GO or BRAKE · ${C[it.chem].name}: ${C[it.chem].brief}`;
    extra+=`<div class="gauge"><div class="g-ends"><span class="brk">GABA<small>BRAKE · INHIBIT</small></span><span class="go" style="text-align:right">GLUTAMATE<small>GO · EXCITE</small></span></div>
      <div class="g-track"><i class="g-needle" style="left:${pos}%"></i></div><div class="g-read">${esc(read)}</div></div>`;
  }
  const opts=c.options.map((o,i)=>{
    let cls="opt";
    if(done){const isAns=it.kind==="text"?o.value===it.ans:o.value===it.chem;if(isAns)cls+=" right";else if(o.value===c.chosen)cls+=" wrong";else cls+=" dim";}
    return `<button class="${cls}" data-ans="${esc(o.value)}" ${done?"disabled":""}><span class="n">${i+1}</span><span class="lab">${esc(o.label)}</span></button>`;}).join("");

  let reveal="";
  if(done&&G.mode!=="rapid"){
    const A=C[it.chem];
    const last=G.i+1>=G.items.length;
    const okNotes=["Signal identified.","The chemistry checks out.","Case closed."];
    const head = c.ok
      ? `<div class="rv-head ok"><h3>${esc(fullName(it.chem))} ✓</h3><span class="note">${it.clues?`<span class="stars">${"★".repeat(G.results[G.results.length-1].stars)}<s>${"★".repeat(3-G.results[G.results.length-1].stars)}</s></span>`:okNotes[G.i%3]}</span></div>`
      : `<div class="rv-head no"><h3>Not quite</h3><span class="note">Investigate the clue</span></div>
         <div class="miss"><p>You chose <b>${esc(it.kind==="text"?c.chosen:C[c.chosen].name)}</b>. ${esc(c.why)}</p>
         ${it.kind==="text"?`<p>Answer: <b>${esc(it.ans)}</b></p>`:""}
         <div class="remember"><span>REMEMBER</span>${esc(c.remember)}</div></div>`;
    reveal=`<div class="reveal" id="reveal">${head}
      ${!c.ok?`<div class="rv-head" style="border-bottom:1px solid var(--line)"><h3 style="font-size:16px;color:var(--ink)">${esc(fullName(it.chem))}</h3><span class="note">case file</span></div>`:""}
      ${profileHTML(it.chem)}
      <div class="rv-foot"><span class="hint">ENTER ↵ to continue</span><button class="btn primary" data-act="next">${last?"End shift →":"Next case →"}</button></div></div>`;
  }
  const total = G.mode==="rapid"?"":` / ${String(G.items.length).padStart(2,"0")}`;
  $app.innerHTML=`<section class="case ${done&&G.mode==="rapid"?(c.ok?"flash-ok":"flash-no"):""}">
    <div class="case-head"><span class="no">CASE ${caseNo}${total}</span><span>${clock(G.i)}</span><span>${esc(MODES[G.mode].short)}</span>${pipsHTML()}<span class="sp"><button data-act="quit">End shift ✕</button></span></div>
    ${extra}
    <p class="prompt">${esc(it.prompt)}</p>
    <div class="opts">${opts}</div>
    ${reveal}
  </section>`;
}
function finish(){
  if(!G)return;if(tick){clearInterval(tick);tick=null;}
  const correct=G.results.filter(r=>r.ok).length;
  S.history.unshift({t:Date.now(),mode:G.mode,correct,total:G.results.length,stars:G.stars});S.history=S.history.slice(0,50);save();
  view="report";render();window.scrollTo(0,0);
}

/* =================== REPORT =================== */
function sessionBuckets(){
  const t=G.tally;const ids=Object.keys(t);
  const strong=ids.filter(id=>t[id].c>0&&t[id].w===0).sort((a,b)=>t[b].c-t[a].c).slice(0,3);
  const weak=ids.filter(id=>t[id].w>0).sort((a,b)=>t[b].w-t[a].w);
  return {strong,weak};
}
function renderReport(){
  const correct=G.results.filter(r=>r.ok).length,total=G.results.length;
  const {strong,weak}=sessionBuckets();
  const names=(arr,cls)=>arr.length?`<div class="names ${cls}">${arr.map(id=>`<span>${esc(C[id].name)}</span>`).join("")}</div>`:`<span style="color:var(--muted);font-size:15px">${cls==="weak"?"Nothing flagged. Clean shift.":"Not enough data yet."}</span>`;
  $app.innerHTML=`<section class="report">
    <div><div class="label">${G.mode==="rapid"?"Night shift complete":"Shift report"} · ${esc(G.title)}</div>
      <div class="big">${correct}<small> / ${total}</small></div>
      ${G.mode==="detective"?`<div class="stars" style="font-size:18px;margin-top:6px">${G.stars} ★ of ${total*3}</div>`:""}
      <p style="color:var(--ink2);margin:8px 0 0">${weak.length?"Your shift isn’t over yet. A short review round targets exactly what you missed.":"The chemistry checks out. Try a harder mode or a different angle."}</p></div>
    <div class="rep-card">
      <div class="rep-row"><span class="label">Chemicals mastered</span><span class="v">${masteredCount()} / 13 <span class="label" style="margin-left:8px">${esc(rank())}</span></span></div>
      <div class="rep-row"><span class="label">Strongest</span>${names(strong,"good")}</div>
      <div class="rep-row"><span class="label">Needs review</span>${names(weak,"weak")}</div>
    </div>
    <div class="cta">
      ${weak.length?`<button class="btn primary" data-review="session">Review weak areas</button>`:""}
      <button class="btn${weak.length?"":" primary"}" data-mode="${G.mode==="review"?"shift":G.mode}">Run it again</button>
      <button class="btn ghost" data-go="hub">Back to night shift</button>
      <button class="btn ghost" data-go="lab">Brain lab</button>
    </div>
  </section>`;
}
function startReview(ids){
  if(!ids.length)ids=weakList();
  if(!ids.length){go("hub");return;}
  const all=B.map(fromBank).concat(traceItems());
  let items=[];
  ids.slice(0,5).forEach(id=>{
    const f=S.chem[id].f;
    const mine=shuffle(all.filter(x=>x.chem===id));
    const missing=mine.filter(x=>!f[x.facet]);
    const pick=(missing.length?missing:mine).slice(0,ids.length<=2?4:2);
    items=items.concat(pick);
  });
  /* add logged mistakes' facets for these chemicals */
  startMode("review",shuffle(items).slice(0,8));
  G.title="Weak-area review";
}

/* =================== BRAIN LAB =================== */
function cardHTML(id){
  const c=C[id],st=mastery(id),f=S.chem[id].f;
  const fac=[["ID",f.id||f.func],["ORIGIN",f.origin],["DEST",f.dest],["OFF",f.dys]];
  return `<details class="card"><summary>
    <div class="row1"><span class="nm">${esc(fullName(id))}</span><span class="state ${st}">${st}</span></div>
    <div class="row1"><span class="mm">“${esc(c.mem)}”</span><span class="chip ${c.cat}">${c.cat==="hormone"?"Hormone":c.type.startsWith("Neuropeptide")?"Neuropeptide":"Neurotransmitter"}</span></div>
    <div class="row1"><span class="facets">${fac.map(([l,on])=>`<i class="${on?"on":""}">${l}</i>`).join("")}</span><span class="more">OPEN FILE +</span></div>
  </summary>${profileHTML(id)}</details>`;
}
function renderLab(){
  const tabs=`<div class="seg" role="group" aria-label="Brain lab view"><button data-lab="cards" aria-pressed="${labView==="cards"}">CASE FILES</button><button data-lab="table" aria-pressed="${labView==="table"}">FINAL REVIEW TABLE</button></div>`;
  let body;
  if(labView==="cards"){
    body=`<div class="ovd" style="margin-top:4px">
      <div><h4>ORIGIN</h4><p>Where the chemical is produced or released. Neurotransmitters come from neurons; hormones come from glands or tissues such as the pineal gland, stomach or fat cells.</p></div>
      <div><h4>DESTINATION</h4><p>Where it acts. Neurotransmitters cross a synapse to receptors on target cells. Hormones travel through the bloodstream to target tissues. A destination is often many places, not one spot.</p></div></div>
    <div class="group-h"><h3>NEUROTRANSMITTERS</h3><p>${NT.length} · including neuropeptides</p></div>
    <div class="lab-grid">${NT.map(cardHTML).join("")}</div>
    <div class="group-h"><h3>HORMONES</h3><p>${HO.length} · carried by the blood</p></div>
    <div class="lab-grid">${HO.map(cardHTML).join("")}</div>
    <p class="diffnote" style="margin-top:18px">A chemical becomes MASTERED once you’ve answered it correctly across identification or function, origin, destination and dysregulation (at least 4 correct). A miss on a facet means earning that facet again.</p>`;
  }else{
    body=`<p class="diffnote" style="margin:0 0 12px">All 13 chemicals. Tap a row to expand it with the AP Psych connection and memory trick.</p>
    <div class="tbl-wrap"><table><thead><tr><th>Chemical</th><th>Type</th><th>Origin</th><th>Destination</th><th>Main job</th><th>Dysregulation</th></tr></thead><tbody>
    ${IDS.map(id=>{const c=C[id];return `<tr class="main" data-row="${id}" tabindex="0"><td>${esc(fullName(id))}</td><td><span class="chip ${c.cat}">${c.cat==="hormone"?"Hormone":c.type.startsWith("Neuropeptide")?"Neuropeptide":"NT"}</span></td><td>${esc(c.o2)}</td><td>${esc(c.d2)}</td><td>${esc(c.j2)}</td><td>${esc(c.f2)}</td></tr>
      <tr class="ext" data-ext="${id}" hidden><td colspan="6"><b>AP PSYCH</b>${esc(c.ap)}<br><b>MEMORY</b><span style="color:var(--amber);font-family:var(--f-mono)">“${esc(c.mem)}”</span><br><b>WHEN IT’S OFF</b>${esc(c.off)}</td></tr>`;}).join("")}
    </tbody></table></div>`;
  }
  $app.innerHTML=`<div class="ph"><div><h2>Brain lab</h2><p>Every chemical’s case file: type, origin, destination, job, what happens when it’s off, the AP Psych connection, and a memory trick.</p></div>${tabs}</div>${body}`;
}

/* =================== LOG =================== */
function renderLog(){
  const L=S.log;
  const masteredInLog=L.filter(e=>mastery(e.chem)==="mastered").length;
  $app.innerHTML=`<div class="ph"><div><h2>Night shift log</h2><p>Every missed case lands here with the reason and a memory trick. Clear entries once the chemical is mastered.</p></div>
    <div class="cta">${L.length?`<button class="btn small" data-review="global">Review weak areas</button>`:""}
    ${masteredInLog?`<button class="btn small ghost" data-act="clearMastered">Clear mastered (${masteredInLog})</button>`:""}
    <button class="btn small danger" data-act="reset">Reset progress</button></div></div>
  ${L.length?`<div class="log">${L.map((e,i)=>`<article class="entry">
      <div class="ft"><span class="label">${new Date(e.t).toLocaleString([], {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})} · ${esc(C[e.chem].name)}</span><span class="state ${mastery(e.chem)}">${mastery(e.chem)}</span></div>
      <p class="q">${esc(e.q)}</p>
      <div class="pair"><div class="c1"><span class="label">What you chose</span><b>${esc(e.chose)}</b></div><div class="c2"><span class="label">Correct answer</span><b>${esc(e.ans)}</b></div></div>
      <p class="why"><span class="label">Why </span>${esc(e.why)}</p>
      <div class="remember"><span>MEMORY TRICK</span>${esc(e.mem)}</div>
      <div class="ft"><span></span><button class="btn small ghost" data-del="${i}">Got it, remove</button></div>
    </article>`).join("")}</div>`
  :`<div class="empty"><p style="margin:0 0 12px">No mistakes logged. Either you’re flawless or your shift hasn’t started.</p><button class="btn primary" data-go="hub">Start night shift</button></div>`}`;
}

/* =================== HOW TO PLAY =================== */
function renderHow(){
  $app.innerHTML=`<div class="ph"><div><h2>How to play</h2><p>You are the night-shift brain investigator. Each case describes something happening in the brain or body. Your job is to name the chemical behind it.</p></div></div>
  <div class="loop" style="margin-bottom:18px"><span>SEE IT</span><em>→</em><span>THINK</span><em>→</em><span>EXPLAIN</span><em>→</em><span>TRACE IT</span><em>→</em><span>UNDERSTAND IT</span><em>→</em><span>APPLY IT</span><em>→</em><span>WATCH IT GO WRONG</span><em>→</em><span>REMEMBER IT</span></div>
  <div class="how">
    <div><h4>THE LOOP</h4><p>Scenario → your guess → a full explanation → next case. Every answer opens the chemical’s case file.</p></div>
    <div><h4>CHEMICAL DETECTIVE</h4><p>Clues arrive one by one. Answer after 1 clue for ★★★, after 2 for ★★, after 3 or more for ★.</p></div>
    <div><h4>TRACE THE SIGNAL</h4><p>Origin → ? → destination. Origin is where a chemical is produced; destination is where it acts.</p></div>
    <div><h4>BRAIN BALANCE</h4><p>GLUTAMATE = GO. GABA = BRAKE. Plus alertness, stress, reward and pain signals.</p></div>
    <div><h4>THE 60-SECOND BRAIN</h4><p>Rapid fire against the clock. Misses still go into your log.</p></div>
    <div><h4>MASTERY</h4><p>UNKNOWN → LEARNING → MASTERED. Mastery needs correct answers on identification or function, origin, destination and dysregulation.</p></div>
    <div><h4>KEYBOARD</h4><p>Press 1 to 4 to answer, Enter for the next case, C to reveal a clue.</p></div>
    <div><h4>SAVED PROGRESS</h4><p>Progress is saved in this browser. Close the tab and your shift picks up where you left off.</p></div>
  </div>
  <div class="cta" style="margin-top:22px"><button class="btn primary" data-go="hub">Start night shift</button><button class="btn danger" data-act="reset">Reset progress</button></div>`;
}

/* =================== MODAL =================== */
function confirmReset(){
  const m=document.getElementById("modal");
  m.innerHTML=`<div role="dialog" aria-modal="true" aria-labelledby="mt"><h3 id="mt">Reset all progress?</h3><p>This clears mastery, scores, history and your Night Shift Log on this device. It cannot be undone.</p>
    <div class="act"><button class="btn ghost small" data-act="mClose" id="mCancel">Keep progress</button><button class="btn danger small" data-act="mReset">Reset everything</button></div></div>`;
  m.hidden=false;document.getElementById("mCancel").focus();
}

/* =================== EVENTS =================== */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-row]");if(!t)return;
  const d=t.dataset;
  if(d.go){go(d.go);return;}
  if(d.diff){S.diff=d.diff;save();render();return;}
  if(d.mode){startMode(d.mode);return;}
  if(d.review){startReview(d.review==="session"&&G?sessionBuckets().weak:[]);return;}
  if(d.lab){labView=d.lab;if(view!=="lab"){view="lab";}render();window.scrollTo(0,0);return;}
  if(d.row){const ext=document.querySelector(`[data-ext="${d.row}"]`);ext.hidden=!ext.hidden;t.classList.toggle("open",!ext.hidden);return;}
  if(d.ans!==undefined){answer(d.ans);return;}
  if(d.del!==undefined){S.log.splice(+d.del,1);save();render();return;}
  switch(d.act){
    case "next":G.i++;nextItem();window.scrollTo(0,0);break;
    case "clue":revealClue();break;
    case "quit":if(G&&G.results.length)finish();else go("hub");break;
    case "clearMastered":S.log=S.log.filter(e=>mastery(e.chem)!=="mastered");save();render();break;
    case "reset":confirmReset();break;
    case "mClose":document.getElementById("modal").hidden=true;break;
    case "mReset":S=blank();save();document.getElementById("modal").hidden=true;go("home");break;
  }
});
document.getElementById("sndBtn").addEventListener("click",e=>{e.stopPropagation();S.sound=!S.sound;save();renderTop();blip(true);});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){document.getElementById("modal").hidden=true;}
  if(e.target.closest&&e.target.closest("[data-row]")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();e.target.click();return;}
  if(view!=="play"||!G||!G.cur||e.metaKey||e.ctrlKey||e.altKey)return;
  const c=G.cur;
  if(c.chosen===null&&/^[1-4]$/.test(e.key)){const o=c.options[+e.key-1];if(o)answer(o.value);}
  else if(c.chosen===null&&(e.key==="c"||e.key==="C")&&c.it.clues)revealClue();
  else if(c.chosen!==null&&e.key==="Enter"&&G.mode!=="rapid"){e.preventDefault();G.i++;nextItem();window.scrollTo(0,0);}
});
window.addEventListener("resize",()=>{if(view==="home")startScope();});

render();
</script>
